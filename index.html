<script>
// ---------- state ----------
const fmt=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const KEY='grit',BADGE='Full-Stack Track Badge',NEED=5,TODAY=fmt(0);
let cool=7; // cool-off days after fail or retake
const seed=()=>{let id=0,slots=[];const add=(iv,d,h,by=null)=>slots.push({id:'S'+ ++id,iv,date:fmt(d),time:h+':00',by});
 add('Priya',0,15,'s1');add('Priya',0,16,'s2');
 for(let d=1;d<=13;d++){[10,11,12].forEach(h=>add('Priya',d,h));[14,15].forEach(h=>add('Rahul',d,h))}

<div class="card rise" style="--i:1"><h3>States</h3><div class="sc"><table><tr><th>State</th><th>Enters when</th><th>Leaves to</th></tr>

<div class="card rise" style="--i:2"><h3>Edge cases and assumptions</h3><ul>
<li>Two students, one slot: the second sees "slot just taken" and the list refreshes.</li>
<li>One active booking per student per badge. Cancel first to rebook.</li>
<li>A recorded slot never reopens, and a slot whose hour has passed cannot be booked.</li>
<li>Interviewer closes a booked hour: blocked. The team reassigns or cancels and notifies the student.</li>
<li>No-show: slot freed, student returns to Eligible with no penalty (assumption).</li>
<li>Student cancels: allowed up to 24 hours before the slot, then the button is replaced by a note.</li>
<li>Fail and retake later both lock rebooking until <code>retry_after</code>. Retake means close, one more look.</li>
<li>Malpractice flag after a pass: badge nullified, student sees the reason. A flag before the interview blocks booking.</li>
<li>All times are IST (assumption). Open questions: maximum retakes, interviewer conflicts of interest, who handles appeals.</li></ul></div>
<div class="card rise" style="--i:3"><h3>Data model</h3><pre>students(id, name, skills_cleared, eligible_at)
interviewers(id, name)
slots(id, interviewer_id, starts_at, ends_at, status[open|booked|done],

         UNIQUE(student_id, badge_id) WHERE status='active')

badges(student_id, badge_id, status[earned|nullified], nullified_reason, PRIMARY KEY(student_id, badge_id))</pre>
<p><b style="font-weight:500">No double booking.</b> A partial unique index on <code>bookings(slot_id) WHERE status='active'</code>. Two simultaneous inserts: one wins, the other gets a constraint error and the UI shows "slot just taken". No app-level locking needed. The prototype mimics this with a check-and-set on the slot.</p></div>
<div class="card rise" style="--i:4"><h3>When the data is big</h3><ul>
<li><b style="font-weight:500">Never draw every row.</b> Roster and Today use a windowed list: about 20 rows exist in the page at any time, however many students there are. In production, page from the server with keyset pagination (<code>WHERE (starts_at, id) &gt; (?, ?) LIMIT 50</code>).</li>
<li><b style="font-weight:500">Never scan.</b> Lookups go through Maps built once per change (by id, by date, by student). In the database these are indexes on <code>slots(starts_at)</code>, <code>bookings(student_id)</code> and <code>bookings(slot_id)</code>.</li>
<li><b style="font-weight:500">Load only what is on screen.</b> Booking reads one day at a time, and shows 20 interviewers with a Show more button.</li>
<li><b style="font-weight:500">Cheap input.</b> Search is debounced and only repaints the list. Saves are debounced into one write, and a full browser store is caught and reported.</li>
<li><b style="font-weight:500">Counts without counting.</b> Roster totals come from one pass here. In production keep counters updated inside the booking transaction, or a materialized view.</li>
<li>Try it: Roster, then Load 10,000 demo students.</li></ul></div>

.brand{display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px;font-weight:500;padding:0 8px 16px}.brand svg{width:20px;height:20px}.brand span{color:var(--ink3);font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;border-radius:10px;background:var(--raise);margin:0 0 8px}.seg button,.seg b{display:block;text-align:center;padding:4px 0;border:0;border-radius:8px;background:none;color:var(--ink2);font:inherit;cursor:pointer;transition:background-color .15s,color .15s}.seg b{background:var(--card);color:var(--ink);font-weight:500;cursor:default;box-shadow:0 0 0 1px var(--line)}.seg button:hover{color:var(--ink)}
.grp{font-size:12px;line-height:16px;color:var(--ink3);padding:0 8px;margin:24px 0 8px}
aside button.nv{display:flex;align-items:center;gap:8px;width:100%;height:32px;margin-bottom:2px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--ink2);font:inherit;cursor:pointer;text-align:left;transition:background-color .15s var(--ease),color .15s var(--ease)}
aside button.nv:hover{background:var(--raise);color:var(--ink)}
aside button.nv.on{background:var(--raise);color:var(--ink);font-weight:500;box-shadow:inset 0 1px 0 var(--line)}
aside button.nv .ic{color:var(--ink3)}aside button.nv.on .ic{color:var(--accent)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 32px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:16px;line-height:24px;font-weight:500;flex:1}
main{padding:32px;max-width:1040px}
h2{margin:0 0 4px;font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.02em}
h3{margin:0 0 8px;font-size:16px;line-height:24px;font-weight:500}
p{margin:8px 0}.mute{color:var(--ink3)}.sub{color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink);font:inherit;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.btn:hover{border-color:var(--ink3)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}.btn.pri:hover{opacity:.9}
.btn.sm{height:32px;padding:0 12px}.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.t{font:500 13px/16px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--raise)}
.st{display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.acc{background:var(--accent)}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.slot{gap:12px}
.bar{height:4px;background:var(--raise);border-radius:4px;overflow:hidden;margin:12px 0 8px}.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse}th{font-weight:400;color:var(--ink3);font-size:12px;line-height:16px}
td,th{padding:12px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
td .ic{vertical-align:-3px}
.status{display:flex;gap:20px;align-items:center}
.medal{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--raise);color:var(--ink3);box-shadow:inset 0 0 0 1px var(--line)}
.medal .ic{width:28px;height:28px}.medal.sm{width:40px;height:40px}.medal.sm .ic{width:18px;height:18px}
.medal.ok{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--accent)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:32px}.ba>div{min-width:0}@media(max-width:1180px){.ba{grid-template-columns:minmax(0,1fr)}}
.ba small{display:block;font-size:12px;line-height:16px;color:var(--ink3);margin-bottom:8px}
main>h3.cap{display:none}
.frame{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg)}.frame .card{margin-bottom:0}.frame h3.cap{color:var(--ink3);font-weight:400;font-size:12px;line-height:16px;margin-bottom:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--on-btn);padding:12px 16px;border-radius:8px;display:none;z-index:9;max-width:90%}
pre{background:var(--raise);padding:16px;border-radius:8px;overflow:auto;font:400 13px/20px "Geist Mono",ui-monospace,monospace;margin:0}
code{font-family:"Geist Mono",ui-monospace,monospace;font-size:13px}
.msg{border:1px solid var(--line);padding:12px 16px;background:var(--raise);border-radius:8px;white-space:pre-line}
ul{padding-left:20px;margin:8px 0}li{margin:4px 0}
@media(max-width:720px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.top,main{padding-left:16px;padding-right:16px}.ba{grid-template-columns:1fr}.status{align-items:flex-start}}
@media(max-width:720px){.shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}.shell>div{min-width:0}main{overflow-x:auto}.top{flex-wrap:wrap;height:auto;padding:8px 16px}#nav{display:flex;gap:4px;overflow-x:auto}#nav{scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}#nav::-webkit-scrollbar{display:none}#nav .grp{display:none}#nav .nv{width:auto;flex:none;margin:0}aside{overflow:hidden}.brand{padding:0 0 8px}}
</style></head><body>
<div class="shell"><aside><div class="brand"><svg viewBox="0 0 20 20" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"><path d="M2 5h16M2 10h11M2 15h6"/></svg>GRIT <span>Interviews</span></div><div class="seg"><button onclick="parent.postMessage('grit:new','*')">New</button><b>Classic</b></div><div id="nav"></div></aside>
<div><div class="top"><h1 id="title"></h1><span id="who"></span><button class="btn sm" onclick="resetAll()">Reset demo</button></div><main id="app"></main></div></div>
<div id="toast"></div>
<script>
// ---------- state (localStorage with in-memory fallback) ----------
const fmt=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const TODAY=fmt(0), BADGE='Full-Stack Track Badge', COOL=7; // cool-off days after fail/retake
const seed=()=>{let id=0,slots=[];
 const add=(iv,d,h,by=null)=>slots.push({id:'S'+ ++id,iv,date:fmt(d),time:h+':00',by});
 add('Priya',0,15,'s1');add('Priya',0,16,'s2');
 for(let d=1;d<=4;d++){[10,11,12].forEach(h=>add('Priya',d,h));[14,15].forEach(h=>add('Rahul',d,h))}
 return{me:'s3',slots,students:[
 {id:'s1',name:'Aarav Mehta',skills:5,st:'booked'},{id:'s2',name:'Diya Rao',skills:5,st:'booked'},
 {id:'s3',name:'Kabir Singh',skills:5,st:'eligible'},{id:'s4',name:'Meera Nair',skills:5,st:'eligible'},
 {id:'s5',name:'Rohan Das',skills:2,st:'not_eligible'},{id:'s6',name:'Sneha Iyer',skills:5,st:'passed'}]}};
let S=parent.snap();   // shared with the new design: same data object, saved by the parent
const save=()=>parent.sync(S);
const NEED=5, me=()=>S.students.find(s=>s.id===S.me), stu=id=>S.students.find(s=>s.id===id);
const slotOf=s=>S.slots.find(x=>x.by===s.id);
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};
const dt=s=>new Date(s.date+'T'+s.time).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const day=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});

// ---------- actions (each is one atomic state change) ----------
function book(id){const s=me(),sl=S.slots.find(x=>x.id===id);
 if(!sl||sl.by)return toast('That slot was just taken. Please pick another.'),go();   // double-booking guard
 if(slotOf(s))return toast('You already have a booking.');
 sl.by=s.id;s.st='booked';save();toast('Interview booked');go()}
function cancel(){const s=me(),sl=slotOf(s);if(sl)sl.by=null;s.st='eligible';save();go()}
function record(sid,res){const s=stu(sid),sl=slotOf(s);if(!sl)return;
 const n=+(document.getElementById('d'+sid)||{}).value||COOL;
 s.st=res==='noshow'?'eligible':res;if(res==='failed'||res==='retake')s.after=fmt(n);
 if(res==='noshow')s.note='noshow';
 sl.by=null;sl.done={sid,res};save();go()}
function nullify(sid){const s=stu(sid);s.st='nullified';save();go()}
function addSlot(){const iv=v('iv'),d=v('dd'),t=v('tt');if(!d||!t)return toast('Pick date and time');
 if(S.slots.some(x=>x.iv===iv&&x.date===d&&x.time===t))return toast('You already have that slot.');
 S.slots.push({id:'S'+Date.now(),iv,date:d,time:t,by:null});save();go()}
function delSlot(id){const i=S.slots.findIndex(x=>x.id===id);if(S.slots[i].by)return toast('Booked. Ask the team to reassign first.');S.slots.splice(i,1);save();go()}
const v=i=>document.getElementById(i).value;
function resetAll(){S=seed();save();go()}

// ---------- icons (lucide paths, 16px, 1.5 stroke) ----------
const P={home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 cal:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
 calc:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
 award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 cols:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/>',
 file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
 lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const st=(l,k)=>`<span class="st"><i class="dot ${k||''}"></i>${l}</span>`;
const medal=(k,sm)=>`<span class="medal ${k==='passed'?'ok':''} ${sm?'sm':''}">${ic(k==='passed'?'award':k==='nullified'?'x':'lock')}</span>`;
const KIND={not_eligible:['Locked',''],eligible:['Ready to book','acc'],booked:['Booked','acc'],passed:['Passed','ok'],failed:['Not passed','bad'],retake:['Retake later','warn'],nullified:['Nullified','bad']};

// ---------- student screens: f(student) -> html, reused by live view and before/after ----------
const canBook=s=>s.st==='eligible'||((s.st==='failed'||s.st==='retake')&&s.after<=TODAY);
const home=(s,live)=>{const sl=slotOf(s)||s._slot;
 const bk=live?`<p><button class="btn pri" onclick="tab='book';go()">Book interview</button></p>`:'';
 const card=(t,body,m)=>`<div class="card"><div class="status">${m||''}<div class="grow">${st(KIND[s.st][0],KIND[s.st][1])}<h2 style="margin-top:8px">${t}</h2>${body}</div></div></div>`;
 const M={
 not_eligible:()=>card('Interview locked',`<p class="sub">Clear ${NEED-s.skills} more skill contest${NEED-s.skills>1?'s':''} to unlock your ${BADGE} interview.</p><div class="bar"><i style="width:${s.skills/NEED*100}%"></i></div><p class="mute">${s.skills} of ${NEED} skills cleared</p>`,medal('locked')),
 eligible:()=>card('Book your interview',`<p class="sub">All ${NEED} skills cleared. Pick a slot to earn your ${BADGE}.</p>${s.note==='noshow'?`<p class="mute">Your last slot was missed. No penalty, pick a new time.</p>`:''}${bk}`),
 booked:()=>card('Interview booked',`<p><span class="t">${sl?sl.time:''}</span> <span class="sub">${sl?dt(sl).replace(/, ?\d+:\d+.*$/,'').replace(/ at .*$/,''):''} with ${sl?sl.iv:''}</span></p><p class="mute">Your result will appear here after the interview.</p>${live?'<p><button class="btn bad" onclick="cancel()">Cancel booking</button></p>':''}`),
 passed:()=>card(`${BADGE} earned`,`<p class="sub">You passed your interview. The badge is now on your profile.</p>`,medal('passed')),
 failed:()=>card('Not passed this time',`<p class="sub">You can book another interview from <b style="font-weight:500">${day(s.after)}</b>. Revisit the interviewer's feedback first.</p>${canBook(s)?bk:''}`,medal('failed')),
 retake:()=>card('Retake later',`<p class="sub">Your interviewer wants a second look. You can rebook from <b style="font-weight:500">${day(s.after)}</b>.</p>${canBook(s)?bk:''}`,medal('retake')),
 nullified:()=>card('Badge nullified',`<p class="sub">Your ${BADGE} was removed after a malpractice flag. Contact the GRIT team to discuss.</p>`,medal('nullified'))};
 return `<h3 class="cap">Home</h3>`+M[s.st]()};
const badges=s=>`<h3 class="cap">My badges</h3><div class="card row" style="gap:16px">${medal(s.st,1)}<div class="grow"><div style="font-weight:500">${BADGE}</div><div class="mute">${s.skills} of ${NEED} skills cleared</div></div>${st(KIND[s.st][0],KIND[s.st][1])}</div>`;
const book_=(s,live)=>{let h='<h3 class="cap">Book interview</h3>';
 if(!canBook(s)){const why={not_eligible:'Clear all skills first.',booked:'You already have a booking. Cancel it to pick another time.',passed:'You have passed. Nothing to book.',nullified:'Booking is disabled for this badge.'}[s.st]||`Rebooking opens on ${day(s.after)}.`;
  return h+`<div class="card row" style="gap:12px;flex-wrap:nowrap"><span class="mute">${ic('lock')}</span><span class="sub">${why}</span></div>`}
 const free=S.slots.filter(x=>!x.by&&!x.done&&x.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const days=[...new Set(free.map(x=>x.date))];
 return h+(days.map(d=>`<div class="card"><div style="font-weight:500">${day(d)}</div><div class="slots">${free.filter(x=>x.date===d).map(x=>`<button class="btn slot" ${live?`onclick="book('${x.id}')"`:'disabled'}><span class="t">${x.time}</span><span class="sub">${x.iv}</span></button>`).join('')}</div></div>`).join('')||'<div class="card">No slots open. Check back soon.</div>')};
const SCREENS={'Student home':home,'Badges':badges,'Book interview':book_};

// ---------- views ----------
let tab='home',outcome='passed';
const NAV=[['Student',[['home','Home','home'],['book','Book interview','cal'],['badges','Badges','award']]],['Interviewer',[['avail','Availability','calc'],['today','Today','clock']]],['Team',[['roster','Roster','users']]],['Prototype',[['ba','Before and after','cols'],['doc','Write-up','file']]]];
const stuTabs=['home','book','badges'];
function go(){
 nav.innerHTML=NAV.map(([g,L],i)=>`<div class="grp" ${i?'':'style="margin-top:16px"'}>${g}</div>`+L.map(([k,l,i])=>`<button class="nv ${k===tab?'on':''}" onclick="tab='${k}';go()">${ic(i)}${l}</button>`).join('')).join('');
 title.textContent=NAV.flatMap(g=>g[1]).find(x=>x[0]===tab)[1];
 who.innerHTML=stuTabs.includes(tab)?`<select aria-label="Student" onchange="S.me=this.value;save();go()">${S.students.map(s=>`<option value="${s.id}" ${s.id===S.me?'selected':''}>${s.name}</option>`).join('')}</select>`:'';
 app.innerHTML=({home:()=>home(me(),1),book:()=>book_(me(),1),badges:()=>badges(me()),avail,today,roster,ba,doc}[tab])()}
const sorted=()=>[...S.slots].filter(x=>x.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const avail=()=>`<div class="card row"><select id="iv" aria-label="Interviewer"><option>Priya</option><option>Rahul</option></select><input type="date" id="dd" min="${TODAY}" aria-label="Date"><input type="time" id="tt" step="3600" aria-label="Time"><button class="btn pri" onclick="addSlot()">Add slot</button></div>
<div class="card"><table><tr><th>Interviewer</th><th>When</th><th>Status</th><th></th></tr>${sorted().map(x=>`<tr><td>${x.iv}</td><td>${dt(x)}</td><td>${x.by?st('Booked by '+stu(x.by).name,'acc'):st('Open','ok')}</td><td style="text-align:right"><button class="btn sm bad" onclick="delSlot('${x.id}')">Remove</button></td></tr>`).join('')}</table></div>`;
const RES={passed:['Passed','ok'],failed:['Not passed','bad'],retake:['Retake later','warn'],noshow:['No-show','']};
const today=()=>{const L=S.slots.filter(x=>x.date===TODAY&&(x.by||x.done)).sort((a,b)=>a.time.localeCompare(b.time));
 return `<p class="sub" style="margin:0 0 16px">${day(TODAY)}</p>`+(L.map(x=>{const sid=x.by||x.done.sid,s=stu(sid);
 return `<div class="card"><div class="row" style="gap:12px"><span class="t">${x.time}</span><span class="grow">${s.name} <span class="mute">with ${x.iv}</span></span>${x.by?st('To interview','acc'):st(RES[x.done.res][0],RES[x.done.res][1])}</div>
 ${x.by?`<div class="row" style="margin-top:16px"><button class="btn pri sm" onclick="record('${sid}','passed')">Pass</button><button class="btn sm" onclick="record('${sid}','failed')">Fail</button><button class="btn sm" onclick="record('${sid}','retake')">Retake later</button><button class="btn sm" onclick="record('${sid}','noshow')">No-show</button><label class="mute" style="margin-left:8px">Rebook after <input id="d${sid}" type="number" value="${COOL}" min="1" style="width:64px;height:32px"> days</label></div>`:''}</div>`}).join('')||'<div class="card">No interviews today.</div>')};
const roster=()=>{const E=S.students.filter(s=>s.skills>=NEED);
 return `<p class="sub" style="margin:0 0 16px"><span style="font-variant-numeric:tabular-nums">${E.filter(s=>s.st==='booked').length} booked, ${E.filter(s=>s.st==='eligible').length} not booked, ${E.length} eligible</span></p><div class="card"><table><tr><th>Student</th><th>Status</th><th>Slot or next date</th><th></th></tr>${E.map(s=>{const sl=slotOf(s);const k=s.st==='eligible'?['Not booked','warn']:KIND[s.st];return `<tr><td>${s.name}</td><td>${st(k[0],k[1])}</td><td>${sl?dt(sl):s.after?'from '+day(s.after):'<span class="mute">None</span>'}</td><td style="text-align:right">${s.st==='passed'?`<button class="btn sm bad" onclick="nullify('${s.id}')">Flag malpractice</button>`:''}</td></tr>`}).join('')}</table></div>`};
const ba=()=>{const base=me();const mk=st=>({...base,skills:NEED,st,after:fmt(COOL)});
 const before={...mk('booked'),_slot:{date:fmt(1),time:'10:00',iv:'Priya'}},after={...mk(outcome),_slot:before._slot};
 return `<div class="card row"><label class="sub">Outcome after the interview <select onchange="outcome=this.value;go()" style="margin-left:8px">${[['passed','Pass'],['failed','Fail'],['retake','Retake later'],['nullified','Nullified (malpractice)']].map(([k,l])=>`<option value="${k}" ${k===outcome?'selected':''}>${l}</option>`).join('')}</select></label></div>`+
 Object.entries(SCREENS).map(([n,f])=>`<div class="ba"><div><small>Before</small><div class="frame">${f(before)}</div></div><div><small>After</small><div class="frame">${f(after)}</div></div></div>`).join('')};
const doc=()=>`<div class="card"><h3>States</h3><table><tr><th>State</th><th>Enters when</th><th>Leaves to</th></tr>
<tr><td>Not eligible</td><td>Skills still missing</td><td>Eligible: last skill cleared</td></tr>
<tr><td>Eligible</td><td>All skills cleared, or no-show, or cool-off over</td><td>Booked: student books a slot</td></tr>
<tr><td>Booked</td><td>Slot reserved in one atomic step</td><td>Eligible: cancel or no-show. Passed, Failed or Retake: interviewer records</td></tr>
<tr><td>Passed</td><td>Interviewer records pass, badge issued</td><td>Nullified: malpractice flag</td></tr>
<tr><td>Failed, Retake later</td><td>Interviewer records, <code>retry_after</code> set (default ${COOL} days)</td><td>Eligible once <code>retry_after</code> passes</td></tr>
<tr><td>Nullified</td><td>Malpractice flag on a passed badge</td><td>Terminal (team can reinstate by hand)</td></tr></table></div>
<div class="card"><h3>Edge cases and assumptions</h3><ul>
<li>Two students, one slot: the second sees "slot just taken" and the list refreshes.</li>
<li>One active booking per student per badge. Cancel first to rebook.</li>
<li>Interviewer removes a booked slot: blocked. The team reassigns or cancels and notifies the student.</li>
<li>No-show: slot freed, student returns to Eligible with no penalty (assumption).</li>
<li>Student cancels: allowed up to 24 hours before (not enforced in the prototype).</li>
<li>Fail and retake later both lock rebooking until <code>retry_after</code>. Retake means close, one more look. The cool-off is configurable per outcome.</li>
<li>Malpractice flag after a pass: badge nullified, student sees the reason. A flag before the interview blocks booking.</li>
<li>Only unbooked slots can be removed. All times are IST (assumption).</li>
<li>Open questions: maximum retakes, whether an interviewer may interview a student they know, who handles appeals.</li></ul></div>
<div class="card"><h3>Data model</h3><pre>students(id, name, skills_cleared, eligible_at)
interviewers(id, name)
slots(id, interviewer_id, starts_at, ends_at, status[open|booked|done],
      UNIQUE(interviewer_id, starts_at))
bookings(id, slot_id, student_id, badge_id, status[active|cancelled|no_show|done], created_at,
         UNIQUE(slot_id) WHERE status='active',
         UNIQUE(student_id, badge_id) WHERE status='active')
outcomes(id, booking_id UNIQUE, result[pass|fail|retake], retry_after, notes, recorded_by, recorded_at)
badges(student_id, badge_id, status[earned|nullified], nullified_reason, PRIMARY KEY(student_id, badge_id))</pre>
<p><b style="font-weight:500">No double booking.</b> A partial unique index on <code>bookings(slot_id) WHERE status='active'</code>. Two simultaneous inserts: one wins, the other gets a constraint error and the UI shows "slot just taken". No app-level locking needed. The prototype mimics this with a check-and-set on the slot.</p></div>
